<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <ng-container *ngFor="let field of config; trackBy: trackByName">

    <!-- Text, Tel, Number -->
    <mat-form-field
      *ngIf="field.type === 'text' || field.type === 'tel' || field.type === 'number'"
      appearance="outline"
    >
      <mat-label>{{ field.label }}</mat-label>
      <input
        matInput
        [type]="field.type"
        [formControlName]="field.name"
        [required]="!!field.required"
      />

      <!-- Errores (excluye uniqueName) -->
      <ng-container *ngFor="let validation of field.validations">
        <ng-container *ngIf="validation.validator !== 'uniqueName'">
          <mat-error class="error-message"
            *ngIf="form.get(field.name)?.hasError(validation.validator)
                   && (form.get(field.name)?.dirty || form.get(field.name)?.touched)">
            <ng-container *ngIf="isString(form.get(field.name)?.getError(validation.validator)); else textErrObj">
              {{ form.get(field.name)?.getError(validation.validator) || validation.message }}
            </ng-container>
            <ng-template #textErrObj>
              {{ form.get(field.name)?.getError(validation.validator)?.message || validation.message }}
            </ng-template>
          </mat-error>
        </ng-container>
      </ng-container>

      <!-- Único bloque para uniqueName -->
      <mat-error class="error-message"
        *ngIf="form.get(field.name)?.hasError('uniqueName')
               && (form.get(field.name)?.dirty || form.get(field.name)?.touched)">
        {{ form.get(field.name)?.getError('uniqueName')?.message }}
      </mat-error>
