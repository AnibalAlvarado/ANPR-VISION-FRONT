<div class="lado-derecho">
  <div class="auth-content mini-contener">
    <div class="card Formulario-login">
      <div class="row align-items-center text-center">
        <div class="col-md-12">
          <div class="card-body">
            <img src="../../../../../assets/images/logoSolo.png" alt="logo" class="img-fluid mb-4" width="100" />
            <h4 class="mb-3 f-w-400">Iniciar sesión</h4>

            <div class="input-group mb-3">
              <span class="input-group-text fondo-icono" id="basic-addon1">
                <i class="feather icon-mail"></i>
              </span>
              <input
                type="email"
                class="form-control input-registro"
                placeholder="Nombre de Usuario"
                [(ngModel)]="LoginDto.username"
                name="userName"
                required />
            </div>

            <div class="input-group mb-4">
              <span class="input-group-text fondo-icono" id="basic-addon3">
                <i class="feather icon-lock"></i>
              </span>

              <input
                [type]="showPwd ?  'password': 'text' "
                class="form-control input-registro"
                placeholder="Contraseña"
                [(ngModel)]="LoginDto.password"
                name="password"
                required />

              <!-- Botón ojito (SVG) para mostrar/ocultar -->
              <button
                type="button"
                class="input-group-text fondo-icono"
                (click)="showPwd = !showPwd"
                [attr.aria-label]="showPwd ? 'Mostrar contraseña': 'Ocultar contraseña' "
                style="cursor:pointer">
                <!-- ojo abierto -->
                <svg *ngIf="!showPwd" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="1.8" />
                  <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/>
                </svg>
                <!-- ojo tachado -->
                <svg *ngIf="showPwd" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="1.8"/>
                  <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/>
                  <path d="M4 20 20 4" stroke="currentColor" stroke-width="1.8" />
                </svg>
              </button>
            </div>

            <div class="d-grid bttn-inicio-sesion">
              <button class="btn btn-block btn-primary mb-4" (click)="login()">Iniciar sesión</button>
            </div>

           <p class="mb-2 text-muted color-p">
              ¿Olvidaste tu contraseña?
              <button type="button"
                      class="btn btn-primary btn-sm f-w-400 olvidasteContraseña"
                      (click)="restablecerContrasena()">
                Restablecer
              </button>
            </p>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="loading-overlay" *ngIf="loading">
  <div class="spinner-overlay">
    <mat-progress-spinner
      mode="indeterminate"
      diameter="60"
      strokeWidth="4"
      color="accent">
    </mat-progress-spinner>
    <p>Cargando...</p>
  </div>
</div>
