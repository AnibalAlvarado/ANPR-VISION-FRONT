<div class="parking-container">
  <!-- Hero Section -->
  <div class="hero-section">
    <div class="hero-toolbar">
      <button
        mat-fab
        extended
        class="btn-new-zone"
        (click)="goToCreate()"
        matTooltip="Crear nueva zona">
        <mat-icon>add</mat-icon>
        Nueva Zona
      </button>

      <div class="search-box">
        <mat-icon class="search-icon">search</mat-icon>
        <input
          type="text"
          placeholder="Buscar por placa, cliente o tipo..."
          class="search-input"
          (keyup)="applyFilter($event)">
      </div>
    </div>
  </div>

  <!-- Stats Bar -->
  <div class="stats-bar">
    <button
      mat-button
      [class.active]="selectedFilter === 'all'"
      (click)="filterByStatus('all')"
      class="stat-chip">
      <div class="stat-content">
        <span class="stat-label">Total</span>
        <span class="stat-value">{{ getTotalZones() }}</span>
      </div>
    </button>

    <button
      mat-button
      [class.active]="selectedFilter === 'active'"
      (click)="filterByStatus('active')"
      class="stat-chip stat-active">
      <div class="stat-content">
        <span class="stat-label">Activas</span>
        <span class="stat-value">{{ getActiveZones() }}</span>
      </div>
    </button>

    <button
      mat-button
      [class.active]="selectedFilter === 'inactive'"
      (click)="filterByStatus('inactive')"
      class="stat-chip stat-inactive">
      <div class="stat-content">
        <span class="stat-label">Inactivas</span>
        <span class="stat-value">{{ originalData.length - getActiveZones() - getDeletedZones() }}</span>
      </div>
    </button>

    <button
      mat-button
      [class.active]="selectedFilter === 'deleted'"
      (click)="filterByStatus('deleted')"
      class="stat-chip stat-deleted">
      <div class="stat-content">
        <span class="stat-label">Eliminadas</span>
        <span class="stat-value">{{ getDeletedZones() }}</span>
      </div>
    </button>
  </div>

  <!-- Zones List -->
  <div class="zones-list" *ngIf="(dataSource?.data?.length || 0) > 0">
    <div
      class="zone-item"
      *ngFor="let zone of dataSource.data"
      [class.is-deleted]="zone.isDeleted">

      <!-- Zone Card -->
      <div class="zone-card">
        <!-- Left: Name & Status -->
        <div class="zone-info">
          <h3 class="zone-name">{{ zone.name }}</h3>
          <div class="status-badge"
            [class.status-active]="zone.asset && !zone.isDeleted"
            [class.status-inactive]="!zone.asset && !zone.isDeleted"
            [class.status-deleted]="zone.isDeleted">
            <mat-icon>{{ zone.isDeleted ? 'cancel' : (zone.asset ? 'check_circle' : 'error') }}</mat-icon>
            <span>{{ zone.isDeleted ? 'Eliminada' : (zone.asset ? 'Activo' : 'Inactivo') }}</span>
          </div>
        </div>

        <!-- Center: Details -->
        <div class="zone-details">
          <div class="detail-item">
            <mat-icon>domain</mat-icon>
            <span>{{ zone.parking }}</span>
          </div>
        </div>

        <!-- Right: Actions -->
        <div class="zone-actions">
          <ng-container *ngIf="!zone.isDeleted">
            <button
              mat-raised-button
              class="btn-edit"
              (click)="goToEdit(zone)"
              matTooltip="Editar zona">
              <mat-icon>edit</mat-icon>
              Editar
            </button>
            <button
              mat-raised-button
              class="btn-delete"
              (click)="deleteZone(zone.id!)"
              matTooltip="Eliminar zona">
              <mat-icon>delete_outline</mat-icon>
              Eliminar
            </button>
          </ng-container>

          <ng-container *ngIf="zone.isDeleted">
            <button
              mat-raised-button
              class="btn-permanent"
              (click)="deletePermanentZone(zone.id!)"
              matTooltip="Eliminar permanentemente">
              <mat-icon>delete_forever</mat-icon>
              Eliminar
            </button>
          </ng-container>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="(dataSource?.data?.length || 0) === 0">
    <div class="empty-content">
      <mat-icon class="empty-icon">location_off</mat-icon>
      <h2 class="empty-title">No hay zonas registradas</h2>
      <p class="empty-text">Crea tu primera zona de parqueo para comenzar</p>
      <button
        mat-raised-button
        class="btn-create"
        (click)="goToCreate()">
        <mat-icon>add_location</mat-icon>
        Crear Primera Zona
      </button>
    </div>
  </div>
</div>
